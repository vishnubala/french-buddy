<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>French Buddy · Ligne A1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>
<div class="wrap">

      <button class="gear" id="gearBtn" aria-label="Réglages" title="Réglages">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>

    </div>
    <div class="modeswitch" id="modeswitch"></div>
    <div class="line">
      <div class="rail"></div>
      <div class="rail-done" id="railDone"></div>
      <div class="ticks" id="ticks"></div>
      <div class="train" id="train"></div>
    </div>
    <div class="line-meta">
      <span id="stationLabel"></span>
      <span id="weekLabel"></span>
    </div>
    <div class="nav" id="nav">
      <div class="levels" id="levels"></div>
      <div class="weeks" id="weeks"></div>
      <div class="days" id="days"></div>
    </div>
  </header>

  <section class="station">
    <div class="station-head">
      <span class="station-num" id="stationNum"></span>
      <h2 id="lessonTitle">—</h2>
      <span class="dur" id="lessonDur"></span>
    </div>
    <div class="platform" id="platform"></div>
    <div class="step" id="step"></div>
  </section>
</div>

<div class="control" id="control">
  <button class="next" id="nextBtn"></button>
</div>

<script type="module" src="/src/main.js"></script>

</html>
